name: Release Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify version and test
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('yyb-protocol/mobile/package.json')).version")
          test "$RELEASE_TAG" = "v$VERSION"
          npm ci --ignore-scripts --prefix yyb-protocol/mobile
          node --test yyb-protocol/client.test.mjs yyb-protocol/mobile/server.test.mjs yyb-protocol/mobile/pairing.test.mjs
      - name: Package source and release notes
        run: |
          git archive --format=zip --output="UESTC-NightSign-Server-${RELEASE_TAG}.zip" HEAD
          git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)' > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 晚安成电服务端 ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: UESTC-NightSign-Server-${{ env.RELEASE_TAG }}.zip
          fail_on_unmatched_files: true
